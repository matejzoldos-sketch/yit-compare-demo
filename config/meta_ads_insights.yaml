opportunities:
  - title: "Jediný silný hráč financovania v Ružinove"
    body: "Green Atrium nehrá 10/90 v reklamách; Slnečnice tiež nie. NUPPU má v Ružinove najplnší financovací stack (10/90 + družstevné + konkrétne benefity)."
  - title: "Vyšší SOV v Ružinove oproti Green Atrium"
    body: "38 vs 12 aktívnych reklám — pri priamom súboji v okrese má NUPPU väčšiu viditeľnosť než dopredaj hotových bytov."
  - title: "Kontrast životného cyklu vs exit projektu"
    body: "Green Atrium komunikuje 90 % predaných a posledné byty; NUPPU môže stavať na novej etape Magnolia a rastúcej komunite."
  - title: "Širší funnel než viladomy"
    body: "Voči Slnečniciam (viladomy + veže) ponúka NUPPU 1–4 izby, investíciu, družstevné aj rodinný segment v Ružinove."
  - title: "Merateľné benefity"
    body: "Kobka v cene, štandard bez doplatkov, bonus prvých 35 pri družstevnom — konkrétnejšie než „uvádzacie ceny“ Slnečnic."
  - title: "Bory ešte nepredáva web USP v Meta"
    body: "Družstevné na skolaudovaných Na Hrádzi je len na webe; v reklamách zatiaľ generická predregistrácia. NUPPU môže ešte vlastniť družstevný narrative v feede."

risks:
  - title: "Slnečnice — najvyšší share of voice"
    body: "56 aktívnych reklám vs 38 NUPPU. CRESCO tlačí celú značku (Nad mestom + viladomy + retail), nie len jeden projekt z demo."
  - title: "Tlak „bývajte teraz“"
    body: "Green Atrium a Slnečnice Nad mestom berú kupujúcich neochotných čakať do jar 2027. Bory v Meta tlačí skôr novú etapu Nádvorie, nie hotový sklad."
  - title: "Financovanie je komodita"
    body: "10/90 a družstevné (aspoň predregistrácia) komunikujú YIT aj Bory v Meta — bez ďalšieho diferenciátora sa NUPPU stráca v feede."
  - title: "Dva fronty: Ružinov + Petržalka"
    body: "Priamy súper GA v Ružinove; Slnečnice a Bory v Petržalke — sales potrebuje dva kontrastné pitchy."
  - title: "Bory družstevné na skolaudovaných (web, nie Meta)"
    source: product_web
    body: "Na borybyvanie.sk/druzstevne-byvanie ponúkajú družstevné v dokončenej etape Na Hrádzi B2 (2024). V aktívnych reklamách zatiaľ len predregistrácia bez tohto USP — ak to začnú tlačiť, bude to silnejší kontrast voči NUPPU Magnolia 2027."

executive_summary:
  - "Slnečnice vedú počtom aktívnych reklám (56), pred YIT/NUPPU (38), Bory (19) a Green Atrium (12)."
  - "Trh sa delí na financovanie (YIT + Bory v Meta), hotový sklad (GA, Slnečnice) a štvrť+značka (Slnečnice, Bory)."
  - "NUPPU je najsilnejší v Ružinove s financovaním a novou etapou; zraniteľný voči „bývajte teraz“ a celkovému SOV Slnečnic."
  - "Bory: produkt na webe (družstevné + Na Hrádzi skolaudované) je silnejší než aktuálna Meta komunikácia — sledovať, či to pôjde do reklám."

